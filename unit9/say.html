<main class="page">
  <header class="page-header">

    <p class="eyebrow">Unit 9 · Speaking</p>
    <h1><span class="hanzi" lang="zh-HK">講</span>Say It Back</h1>
    <p class="lede">Say times, days and dates yourself and see how your tones compare with a native speaker's.</p>
  </header>
  <div id="say"></div>
</main>
<script src="../shared/core.js?v=bf48f656"></script>

<script src="vocab.js?v=57b842c5"></script>
<script>
  const V = window.VOCAB;
  SayIt.init({
    root: document.getElementById('say'),
    key: 'u9-say',
    pool: [...V.clock, ...V.day, ...V.calendar, ...V.days, ...V.verbs, ...V.times.filter(t => t.note), ...V.minutes, ...V.weekdays, ...V.months, ...V.phrases, ...V.sentences],
  });
</script>
