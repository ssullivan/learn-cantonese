    <h1><span class="hanzi" lang="zh-HK">聲調</span>Tone Detective</h1>
    <p class="lede">Hear a syllable and catch its tone. Start with two very different tones and work up to all six.</p>
  </header>
  <div id="game"></div>
</main>
<script src="../shared/core.js?v=fe121fe2"></script>

<script>
  const V = window.VOCAB;
  Tones.init({
    root: document.getElementById('game'),
    key: 'u1-tones',
    levels: [
      { id: 'high-low', name: 'High or low', blurb: 'Tone 1 or tone 4: top of your voice, or the bottom?', pool: V.inTones(1, 4), choices: 2, tones: [1, 4] },
      { id: 'level', name: 'Three steps', blurb: 'The level tones: 1 high, 3 middle, 6 low.', pool: V.inTones(1, 3, 6), choices: 3, tones: [1, 3, 6] },
      { id: 'rising', name: 'Two rises', blurb: 'Tone 2 or tone 5: how high does it go?', pool: V.inTones(2, 5), choices: 2, tones: [2, 5] },
      { id: 'all-six', name: 'All six', blurb: 'Any tone, four choices.', pool: V.sets, choices: 4 },
      { id: 'words', name: 'Real words', blurb: 'Everyday words, including two-syllable ones.', pool: [...V.basics, ...V.spelling], choices: 4 },
    ],
  });
</script>
