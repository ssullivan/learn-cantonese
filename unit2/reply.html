<script>
  const V = window.VOCAB;
  const all = Canto.entries(V);
  Reply.init({
    root: document.getElementById('game'),
    key: 'u2-reply',
    vocab: V,
    levels: [
      { id: 'meaning', name: 'Hear it', blurb: 'Hear a phrase and pick what it means.', modes: ['meaning'], pool: all },
      { id: 'reply', name: 'Answer back', blurb: 'Someone speaks to you. What do you say back?', modes: ['reply'], pool: all.filter(e => e.reply) },
      { id: 'when', name: 'What do you say?', blurb: '唔該, 多謝 or 對唔住? Pick the phrase for the situation.', modes: ['when'], pool: all.filter(e => e.when) },
      { id: 'rush', name: 'Rush', blurb: 'Answers and situations mixed, eight seconds each.', modes: ['reply', 'when'], pool: all.filter(e => e.reply || e.when), time: 8 },
    ],
  });
</script>
