<script>
  const V = window.VOCAB;
  const two = V.counts.filter(c => c.n === 2);
  SayIt.init({
    root: document.getElementById('say'),
    key: 'u5-say',
    pool: [...V.measures, ...V.words, ...V.things, ...V.ones.slice(0, 6), ...two.slice(0, 6), ...V.sentences],
  });
</script>
