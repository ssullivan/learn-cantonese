      { id: 'measures', name: 'Measure words', blurb: 'One syllable each: 隻 本 張 條… Three choices.', pool: [...V.measures, ...V.words], choices: 3 },
      { id: 'things', name: 'Things', blurb: 'The nouns: 貓, 蘋果, 筷子…', pool: V.things, choices: 4 },
