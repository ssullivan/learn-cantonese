    <p class="lede">Introduce yourself and ask questions, and see how your tones compare with a native speaker's.</p>

  <div id="say"></div>

<script src="../shared/core.js?v=6f9c5dde"></script>

<script>
  const V = window.VOCAB;
  const s = (...ids) => ids.map(id => Canto.entries(V).find(e => e.id === id));
  SayIt.init({
    root: document.getElementById('say'),
    key: 'u3-say',
    pool: [...V.people, ...V.things, ...V.answers,
      ...s('ngo-giu-aa-ming', 'nei-giu-mat-je-meng-aa', 'nei-ne', 'keoi-hai-bin-go-aa', 'nei-hai-m-hai-hok-saang-aa', 'nei-sik-m-sik-gong-jing-man-aa', 'ngo-sik-gong-gwong-dung-waa')],
  });
</script>
