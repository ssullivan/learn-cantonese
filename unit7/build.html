    <h1><span class="hanzi" lang="zh-HK">落單</span>Build &amp; Say</h1>
    <p class="lede">Put an order together from word tiles, then say it yourself and compare your tones with a native speaker's.</p>

</main>

<script src="vocab.js?v=0cf76135"></script>
<script>
  const V = window.VOCAB;
  const { zh } = Canto;
  const step = s => Canto.entries(V).filter(e => e.step === s);
  const build = (s, extra) => Tiles.round({ pool: step(s), vocab: V, decoys: V.measures.map(m => m.id), extra, say: true });
  Game.init({
    root: document.getElementById('game'),
    key: 'u7-build',
    intro: `<strong>How to play:</strong> read the order, tap the tiles to build it in Cantonese, then Check.
      Then hear it, press <strong>● Record</strong>, say it yourself, and compare the pitch of your voice with the model's:
      tones are pitch shapes, so match the <em>shape</em> of the line. Only building the order is scored. Recordings stay on your device.
      Word order: ${zh('我要', 'ngo5 jiu3')} + number + measure + dish.`,
    levels: [
      { id: 'one', name: 'One of each', blurb: '我要一 + measure + dish. Is it 籠, 碟 or 碗?', rounds: 6, time: 0, round: build('one', 2) },
      { id: 'count', name: 'How many?', blurb: 'Two to five. Watch out: two is 兩 before a measure word.', rounds: 6, time: 0, round: build('count', 2) },
      { id: 'please', name: '唔該！', blurb: 'Get the staff\'s attention first. 唔該 or 多謝?', rounds: 6, time: 0, round: build('please', 3) },
    ],
  });
</script>
