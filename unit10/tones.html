    <h1><span class="hanzi" lang="zh-HK">聲調</span>Tone Detective</h1>
    <p class="lede">Hear a family word and catch its tones. Is it 媽媽 or 嫲嫲?</p>

  <div id="game"></div>

<script src="vocab.js?v=89152af3"></script>
<script>
  const V = window.VOCAB;
  const doubled = ['dad', 'mum', 'elder-brother', 'dads-dad', 'dads-mum', 'mums-dad', 'mums-mum'];
  Tones.init({
    root: document.getElementById('game'),
    key: 'u10-tones',
    levels: [
      { id: 'doubled', name: '媽媽 or 嫲嫲?', blurb: 'Doubled names start low: 爸爸 baa4 baa1, 嫲嫲 maa4 maa4, 婆婆 po4 po2.',
        pool: Canto.entries(V).filter(e => doubled.includes(e.id)), choices: 3, tones: [1, 2, 4] },
      { id: 'words', name: 'Family words', blurb: '家姐 細佬 細妹 老公 老婆 仔 女… Three choices.',
        pool: [...V.parents, ...V.siblings, ...V.grandparents, ...V.own, ...V.words], choices: 3 },
      { id: 'whose', name: 'Whose?', blurb: '我嘅書, 爸爸嘅媽媽, 我隻貓.', pool: [...V.whose, ...V.relations, ...V.mine], choices: 4 },
      { id: 'sentences', name: 'Sentences', blurb: '我有兩個家姐: five syllables and more.', pool: V.sentences, choices: 4 },
    ],
  });
</script>
