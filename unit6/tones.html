<body>
<main class="page">
  <header class="page-header">
    <a class="back" href="../">← Unit 6</a>
    <p class="eyebrow">Unit 6 · Game</p>
    <h1><span class="hanzi" lang="zh-HK">聲調</span>Tone Detective</h1>
    <p class="lede">Hear a shopping word or a price, and catch its tones. Is it 買 or 賣?</p>
  </header>
  <div id="game"></div>
</main>
<script src="../shared/core.js?v=fe121fe2"></script>

<script src="../unit5/vocab.js?v=c7ef5f1f"></script>
<script src="vocab.js?v=438f8da1"></script>
<script>
  const V = window.VOCAB;
  Tones.init({
    root: document.getElementById('game'),
    key: 'u6-tones',
    levels: [
      { id: 'buy-sell', name: '買 or 賣?', blurb: 'maai5 (buy) or maai6 (sell): only tones 5 and 6.', pool: V.words.filter(w => w.id.startsWith('maai')), choices: 2, tones: [5, 6] },
      { id: 'words', name: 'Shopping words', blurb: '錢 蚊 毫 平 貴 要… Three choices.', pool: [...V.money, ...V.words], choices: 3 },
      { id: 'things', name: 'Things', blurb: '橙, 雞蛋, 西瓜, 麵包 and 好平, 好貴.', pool: [...V.things.filter(t => !t.unit), ...V.adjectives], choices: 4 },
      { id: 'prices', name: 'Prices', blurb: '三蚊半, 百五蚊, 兩百五: three syllables and more.', pool: [...V.cash, ...V.prices], choices: 4 },
    ],
  });
</script>
