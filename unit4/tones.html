      { id: 'to-99', name: 'Up to 99', blurb: 'Two and three syllables, including 廿.', pool: V.numbers.slice(11), choices: 4 },
      { id: 'big', name: 'Big numbers & words', blurb: '百, 千, 萬, 第, 幾多 and longer numbers.', pool: [...V.words, ...V.ordinals, ...V.big], choices: 4 },
