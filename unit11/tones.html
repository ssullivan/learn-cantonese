<script>
  const V = window.VOCAB;
  Tones.init({
    root: document.getElementById('game'),
    key: 'u11-tones',
    levels: [
      { id: 'one', name: '去 喺 左 右', blurb: 'One syllable each: 去 heoi3, 喺 hai2, 左 zo2, 右 jau6, 近 kan5, 遠 jyun5…',
        pool: [...V.verbs, ...V.where, ...V.way, ...V.places].filter(e => !e.jyutping.includes(' ')), choices: 3 },
      { id: 'words', name: 'Places and transport', blurb: '巴士 的士 港鐵, 醫院 公園 洗手間…', pool: [...V.transport, ...V.places, ...V.stations], choices: 3 },
      { id: 'way', name: 'Directions', blurb: '直行, 轉左, 喺右邊, 對面.', pool: [...V.way, ...V.phrases, ...V.directions], choices: 4 },
      { id: 'sentences', name: 'Sentences', blurb: '我搭巴士去機場, 洗手間喺邊度呀？', pool: [...V.questions, ...V.sentences], choices: 4 },
    ],
  });
